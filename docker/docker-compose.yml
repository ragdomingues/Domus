services:
  postgres:
    image: postgres:16-alpine
    container_name: domus-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-domus}
      POSTGRES_USER: ${POSTGRES_USER:-domus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-domus_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - domus_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-domus} -d ${POSTGRES_DB:-domus}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../src/backend
      dockerfile: Domus.Api/Dockerfile
    container_name: domus-api
    depends_on:
      postgres:
        condition: service_healthy
    # Variáveis planas no estilo TopInvest (SMTP_HOST, MAIL_FROM, APP_PUBLIC_URL, …)
    env_file:
      - path: ../.env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-domus};Username=${POSTGRES_USER:-domus};Password=${POSTGRES_PASSWORD:-domus_dev_password}
      Jwt__Issuer: ${JWT_ISSUER:-domus}
      Jwt__Audience: ${JWT_AUDIENCE:-domus-app}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-DOMUS_DEV_SIGNING_KEY_CHANGE_IN_PRODUCTION_32CHARS_MIN}
      Emqx__HealthUrl: http://emqx:18083/api/v5/status
      Mqtt__Enabled: "true"
      Mqtt__Host: emqx
      Mqtt__Port: "1883"
      Mqtt__UseTls: "false"
      Mqtt__Username: ${MQTT_API_USERNAME:-domus_api}
      Mqtt__Password: ${MQTT_API_PASSWORD:-domus_api_dev_password}
      Mqtt__HookSecret: ${MQTT_HOOK_SECRET:-domus_mqtt_hook_dev_secret}
      Mqtt__ClientId: domus-api
      # Espelho ASP.NET — Secure NÃO via Smtp__Secure (ASP.NET não aceita 0/1).
      # PostConfigure lê SMTP_SECURE (estilo TopInvest: 0/1).
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Pass: ${SMTP_PASS:-}
      Smtp__MailFrom: ${MAIL_FROM:-}
      Smtp__AppPublicUrl: ${APP_PUBLIC_URL:-}
      Auth__ExposeResetToken: ${AUTH_EXPOSE_RESET_TOKEN:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-0}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      AUTH_EXPOSE_RESET_TOKEN: ${AUTH_EXPOSE_RESET_TOKEN:-true}
      ExpoPush__AccessToken: ${EXPO_ACCESS_TOKEN:-}
      ExpoPush__ApiUrl: ${EXPO_PUSH_API_URL:-https://exp.host/--/api/v2/push/send}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      EXPO_PUSH_API_URL: ${EXPO_PUSH_API_URL:-https://exp.host/--/api/v2/push/send}
      HistoryRetention__RetentionDays: ${HISTORY_RETENTION_DAYS:-90}
      HistoryRetention__IntervalHours: ${HISTORY_RETENTION_INTERVAL_HOURS:-24}
      HISTORY_RETENTION_DAYS: ${HISTORY_RETENTION_DAYS:-90}
      HISTORY_RETENTION_INTERVAL_HOURS: ${HISTORY_RETENTION_INTERVAL_HOURS:-24}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  emqx:
    image: emqx/emqx:5.8.3
    container_name: domus-emqx
    depends_on:
      api:
        condition: service_healthy
    environment:
      EMQX_NAME: domus
      EMQX_HOST: 127.0.0.1
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USER:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-public}
      DOMUS_MQTT_HOOK_SECRET: ${MQTT_HOOK_SECRET:-domus_mqtt_hook_dev_secret}
    ports:
      - "${EMQX_MQTT_PORT:-1883}:1883"
      - "${EMQX_MQTT_TLS_PORT:-8883}:8883"
      - "${EMQX_DASHBOARD_PORT:-18083}:18083"
    volumes:
      - ./emqx/emqx.conf.template:/opt/emqx/etc/emqx.conf.template:ro
      - ./emqx/docker-entrypoint-domus.sh:/docker-entrypoint-domus.sh:ro
      - domus_emqx_data:/opt/emqx/data
    entrypoint: ["/bin/sh", "/docker-entrypoint-domus.sh"]
    command: ["emqx", "foreground"]
    healthcheck:
      test: ["CMD", "emqx", "ctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  domus_pg_data:
  domus_emqx_data:
