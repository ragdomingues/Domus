; Domus ESP32 — Portão Rossi
; Framework Arduino + PlatformIO

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps =
  bblanchon/ArduinoJson @ ^7.2.1
  256dpi/MQTT @ ^2.5.2
build_flags =
  -DFIRMWARE_VERSION=\"1.1.0\"
  -DCORE_DEBUG_LEVEL=1

; MQTT TLS com validação de CA (ISRG Root X1 ou MQTT_CA_CERT em secrets.h)
[env:esp32dev_tls]
extends = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -DDOMUS_MQTT_TLS=1

; Lab: TLS sem validar CA (EMQX self-signed / docker)
[env:esp32dev_tls_insecure]
extends = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -DDOMUS_MQTT_TLS=1
  -DDOMUS_MQTT_TLS_INSECURE=1

; Com fim de curso nos GPIOs 32 (OPEN) e 33 (CLOSED)
[env:esp32dev_limits]
extends = env:esp32dev
build_flags =
  ${env:esp32dev.build_flags}
  -DDOMUS_LIMIT_SWITCHES=1
